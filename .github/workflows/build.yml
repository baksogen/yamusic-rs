# Каждый push и PR: clippy, тесты и сборки в артефактах: exe для Windows, .deb, .rpm и
# AppImage для Linux (x86_64 и aarch64), .dmg и universal-бинарник для macOS.
# Тег v* (например v1.0.1): то же и релиз со всеми файлами. Его создаёт отдельное задание после всех сборок.
# Встроенная обновлялка на Windows ищет в релизе yamusic-rs.exe.
name: Сборка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  # Мак первым в файле: его очередь машин самая долгая.
  # Универсальный бинарник (aarch64 + x86_64) через lipo: один файл работает на любом Маке.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      # Гарантируем, что x86_64 таргет установлен и доступен (dtolnay/rust-toolchain
      # на macOS иногда не кладёт его в PATH первым).
      - name: Ensure x86_64 target
        run: |
          rustup target add x86_64-apple-darwin || true
          rustc --print target-libdir --target x86_64-apple-darwin

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      # Обе арки, lipo, .app с ad-hoc подписью и .dmg с симлинком /Applications.
      - name: Универсальный .app и .dmg
        run: |
          tools/make_dmg.sh
          cp target/release/yamusic-rs-universal yamusic-rs-macos-universal
          lipo -info yamusic-rs-macos-universal
          shasum -a 256 yamusic-rs-macos-universal target/release/yamusic-rs-*.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: yamusic-rs-macos-universal
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: target/release/yamusic-rs-*.dmg
          archive: false

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Тег совпадает с версией в Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$v" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Тег $GITHUB_REF_NAME, а в Cargo.toml версия $v"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: SHA-256
        shell: pwsh
        run: (Get-FileHash target/release/yamusic-rs.exe -Algorithm SHA256).Hash.ToLower()

      # Без zip: из артефактов скачивается сразу yamusic-rs.exe.
      - uses: actions/upload-artifact@v7
        with:
          name: yamusic-rs-exe
          path: target/release/yamusic-rs.exe
          archive: false

  # Ubuntu 22.04 — самая старая glibc (2.35) среди поддерживаемых: собранное здесь
  # запускается и на ней, и на всех более новых дистрибутивах.
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Зависимости сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev \
            libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy --release --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

      - name: Пакеты
        id: pkg
        run: |
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm
          tools/appimage.sh
          cargo deb --no-build
          cargo generate-rpm
          echo "deb=$(ls target/debian/*.deb)" >> "$GITHUB_OUTPUT"
          echo "rpm=$(ls target/generate-rpm/*.rpm)" >> "$GITHUB_OUTPUT"

      - name: SHA-256
        run: sha256sum target/release/yamusic-rs target/appimage/*.AppImage ${{ steps.pkg.outputs.deb }} ${{ steps.pkg.outputs.rpm }}

      # По файлу на артефакт: без zip каждый скачивается как есть.
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-x86_64
          path: target/appimage/yamusic-rs-x86_64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: deb-x86_64
          path: ${{ steps.pkg.outputs.deb }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-x86_64
          path: ${{ steps.pkg.outputs.rpm }}
          archive: false

  # Нативный ARM-раннер на той же Ubuntu 22.04 (glibc 2.35), без qemu и кросс-тулчейна.
  # Clippy и тесты уже прошли на x86_64, здесь только сборка и пакеты.
  linux-arm64:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Зависимости сборки
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libasound2-dev libfontconfig1-dev libfreetype-dev             libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev             libxcursor-dev libxi-dev libxrandr-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --release

      - name: Пакеты
        id: pkg
        run: |
          command -v cargo-deb >/dev/null || cargo install --locked cargo-deb
          command -v cargo-generate-rpm >/dev/null || cargo install --locked cargo-generate-rpm
          tools/appimage.sh
          cargo deb --no-build
          cargo generate-rpm
          echo "deb=$(ls target/debian/*.deb)" >> "$GITHUB_OUTPUT"
          echo "rpm=$(ls target/generate-rpm/*.rpm)" >> "$GITHUB_OUTPUT"

      - name: SHA-256
        run: sha256sum target/release/yamusic-rs target/appimage/*.AppImage ${{ steps.pkg.outputs.deb }} ${{ steps.pkg.outputs.rpm }}

      - uses: actions/upload-artifact@v7
        with:
          name: appimage-aarch64
          path: target/appimage/yamusic-rs-aarch64.AppImage
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: deb-arm64
          path: ${{ steps.pkg.outputs.deb }}
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          name: rpm-aarch64
          path: ${{ steps.pkg.outputs.rpm }}
          archive: false

  # Мак ждём, но не требуем: GitHub бывает не выдаёт macOS-машину (job отменяется, не падает). Тогда релиз
  # выходит без мака, а «Re-run failed jobs» досборкой мака догружает его файлы в тот же релиз.
  # Проверка тега на версию — в job windows, поэтому его успех обязателен.
  release:
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.linux-arm64.result == 'success' && needs.macos.result != 'failure' }}
    needs: [windows, linux, linux-arm64, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # В «What's Changed» GitHub кладёт только PR: свои коммиты дописываем туда же.
      - name: Заметки релиза
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Перезапуск: релиз уже есть, заметки не нужны (а свежим релизом был бы он сам).
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          prev=$(gh release view --json tagName --jq .tagName)
          gh api "repos/$GH_REPO/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" -f previous_tag_name="$prev" --jq .body > notes.md
          # Свои коммиты, без PR: заголовок «… (#N)» ставит squash-слияние PR, «X.Y.Z» — коммит версии.
          gh api "repos/$GH_REPO/compare/$prev...$GITHUB_REF_NAME" --paginate --jq '.commits[]
            | (.commit.message | split("\n")[0]) as $t
            | select(($t | test("\\(#[0-9]+\\)")) or ($t | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")) | not)
            | "* \($t) by @\(.author.login // .commit.author.name) in \(.html_url)"' > own.md
          python3 - <<'EOF'
          notes = open('notes.md', encoding='utf8').read()
          own = open('own.md', encoding='utf8').read().strip()
          head = "## What's Changed\n"
          if own:
              if head in notes:
                  i = notes.index(head) + len(head)
                  j = notes.find('\n\n', i)
                  j = len(notes) if j < 0 else j
                  notes = notes[:j] + '\n' + own + notes[j:]
              else:
                  notes = head + own + '\n\n' + notes
          open('notes.md', 'w', encoding='utf8').write(notes)
          EOF

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! have=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); then
            gh release create "$GITHUB_REF_NAME" dist/* --title "Яндекс Музыка RS ${GITHUB_REF_NAME#v}" --notes-file notes.md
            exit
          fi
          # Перезапуск: догружаем только недостающее, yamusic-rs.exe не пропадает из релиза ни на миг.
          for f in dist/*; do
            grep -qxF "$(basename "$f")" <<<"$have" || gh release upload "$GITHUB_REF_NAME" "$f"
          done
